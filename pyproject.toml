[tool.poetry]
name = "icu-rounds-app"
version = "0.1.0"
description = "ICU Rounds App with local LLM"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "icu_local_ai" }
]

[tool.poetry.dependencies]
python = "^3.12"
streamlit = "^1.50.0"
pydantic = "^2.11.9"
numpy = "^2.3.3"
pandas = "^2.3.2"
altair = "^5.5.0"
pyarrow = "^21.0.0"
protobuf = "^6.32.1"
watchdog = "^6.0.0"
requests = "^2.32.5"
tenacity = "^9.1.2"
tornado = "^6.5.2"
click = "^8.3.0"
blinker = "^1.9.0"
cachetools = "^6.2.0"
setuptools = "^80.9.0"
langsmith = "^0.4.31"
langchain = "^1.0.0"
plotly = "^6.3.1"
openai = "^2.3.0"
langchain-community = "^0.4.1"
langchain-openai = "^1.1.3"
pymongo = "^4.15.5"
python-dotenv = "^1.2.1"
langchain-core = "^1.2.19"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
black = "^24.3.0"
isort = "^6.0.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
